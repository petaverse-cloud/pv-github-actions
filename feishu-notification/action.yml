name: 'Feishu Notification'
description: 'Send build notifications to Feishu (Lark) using webhook'
author: 'Petaverse DevOps Team'

inputs:
  webhook_url:
    description: 'Feishu webhook URL'
    required: true
  status:
    description: 'Build status: started, success, or failure'
    required: true
  project_name:
    description: 'Project name to display in notification'
    required: true
  run_number:
    description: 'GitHub Actions run number'
    required: false
    default: ${{ github.run_number }}
  actor:
    description: 'User who triggered the workflow'
    required: false
    default: ${{ github.actor }}
  branch:
    description: 'Git branch name'
    required: false
    default: ${{ github.ref_name }}
  commit_sha:
    description: 'Git commit SHA (short)'
    required: false
  commit_message:
    description: 'Git commit message'
    required: false
  start_time:
    description: 'Build start time'
    required: false
  build_duration:
    description: 'Build duration (e.g., 120s)'
    required: false
  image_info:
    description: 'Docker image information'
    required: false
  workflow_url:
    description: 'GitHub Actions workflow URL'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  commit_url:
    description: 'Git commit URL'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

runs:
  using: 'composite'
  steps:
    - name: Send Feishu notification
      shell: bash
      run: |
        # Get current time
        CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')

        # Set card content based on status
        if [ "${{ inputs.status }}" = "started" ]; then
          TITLE="🚀 ${{ inputs.project_name }} Build #${{ inputs.run_number }} Started"
          TEMPLATE="grey"
          CONTENT="**User:** ${{ inputs.actor }}\\n**Project:** ${{ inputs.project_name }}\\n**Branch:** ${{ inputs.branch }}\\n**Start Time:** ${CURRENT_TIME}\\n\\n**Commit:** [${{ inputs.commit_sha }}](${{ inputs.commit_url }})\\n\\n**Status:** Building..."
          BUTTON_TEXT="View Workflow"
          BUTTON_URL="${{ inputs.workflow_url }}"
        elif [ "${{ inputs.status }}" = "success" ]; then
          TITLE="✅ ${{ inputs.project_name }} Build #${{ inputs.run_number }} Succeeded"
          TEMPLATE="green"
          CONTENT="**User:** ${{ inputs.actor }}\\n**Project:** ${{ inputs.project_name }}\\n**Branch:** ${{ inputs.branch }}\\n**Start Time:** ${{ inputs.start_time }}\\n**Duration:** ${{ inputs.build_duration }}\\n\\n**Commit:** [${{ inputs.commit_sha }}](${{ inputs.commit_url }})\\n**Message:** ${{ inputs.commit_message }}\\n\\n**Image:** \`${{ inputs.image_info }}\`\\n\\n**Status:** ✅ Pushed to ACR"
          BUTTON_TEXT="View Workflow Details"
          BUTTON_URL="${{ inputs.workflow_url }}"
        else
          TITLE="❌ ${{ inputs.project_name }} Build #${{ inputs.run_number }} Failed"
          TEMPLATE="red"
          CONTENT="**User:** ${{ inputs.actor }}\\n**Project:** ${{ inputs.project_name }}\\n**Branch:** ${{ inputs.branch }}\\n**Start Time:** ${{ inputs.start_time }}\\n**Failure Time:** ${CURRENT_TIME}\\n\\n**Commit:** [${{ inputs.commit_sha }}](${{ inputs.commit_url }})\\n\\n**Status:** ❌ Build or push failed"
          BUTTON_TEXT="View Error Logs"
          BUTTON_URL="${{ inputs.workflow_url }}"
        fi

        # Send Feishu interactive card notification
        curl -X POST "${{ inputs.webhook_url }}" \
          -H 'Content-Type: application/json' \
          -d '{
            "msg_type": "interactive",
            "card": {
              "config": {
                "wide_screen_mode": true
              },
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "'"${TITLE}"'"
                },
                "template": "'"${TEMPLATE}"'"
              },
              "elements": [
                {
                  "tag": "markdown",
                  "content": "'"${CONTENT}"'"
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "'"${BUTTON_TEXT}"'"
                      },
                      "type": "primary",
                      "url": "'"${BUTTON_URL}"'"
                    }
                  ]
                }
              ]
            }
          }'

branding:
  icon: 'message-circle'
  color: 'blue'
